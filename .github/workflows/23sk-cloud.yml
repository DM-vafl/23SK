name: 23SK cloud monitor and Pages

on:
  schedule:
    # Every 5 minutes, offset from the top of the hour to reduce queue delays.
    - cron: '2-59/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 23sk-cloud-monitor
  cancel-in-progress: false

jobs:
  monitor-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests python-docx

      - name: Check Yandex Disk and Telegram updates
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
          YANDEX_PUBLIC_URL: https://disk.yandex.ru/d/F_GFm6_Qi9GYAQ
          TARGET_GROUP: 23СК
        run: python cloud/monitor_once.py

      - name: Detect website data changes
        id: site_changes
        shell: bash
        run: |
          if git diff --quiet -- site/data.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Save monitoring state
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/cloud-state.json site/data.json
          if ! git diff --cached --quiet; then
            git commit -m "Update 23SK monitoring state"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - name: Configure GitHub Pages
        if: steps.site_changes.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/configure-pages@v5

      - name: Upload website
        if: steps.site_changes.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publish website
        if: steps.site_changes.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/deploy-pages@v4
